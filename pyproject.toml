[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "anthropic>=0.55.0",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.29.0",
    "email-validator>=2.1.1",
    "fastapi>=0.115.14",
    "frontend>=0.0.3",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "joblib>=1.5.1",
    "numpy>=2.3.1",
    "openai>=1.93.0",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pyyaml>=6.0.2",
    "redis>=5.0.0",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "streamlit>=1.46.1",
    "uvicorn>=0.34.3",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
